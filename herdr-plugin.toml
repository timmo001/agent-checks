id = "timmo.agent-checks"
name = "Agent Checks"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "CI and lint status for each workspace, with an Omarchy panel"
platforms = ["linux"]

[[build]]
command = ["mise", "exec", "--", "bun", "install", "--frozen-lockfile"]

[[build]]
command = ["mise", "run", "build"]

[[startup]]
command = ["mise", "exec", "--", "bun", "dist/index.js", "start"]

[[events]]
on = "workspace.created"
command = ["mise", "exec", "--", "bun", "dist/index.js", "start"]

[[events]]
on = "worktree.opened"
command = ["mise", "exec", "--", "bun", "dist/index.js", "start"]

[[actions]]
id = "start"
title = "Start the Agent Checks watcher"
contexts = ["global", "workspace"]
command = ["mise", "exec", "--", "bun", "dist/index.js", "start"]

[[actions]]
id = "open"
title = "Open CI checks"
contexts = ["workspace", "pane"]
command = ["mise", "exec", "--", "bun", "dist/index.js", "open", "--kind", "ci"]

[[actions]]
id = "lint"
title = "Open lint checks"
contexts = ["workspace", "pane"]
command = ["mise", "exec", "--", "bun", "dist/index.js", "open", "--kind", "lint"]

[[actions]]
id = "paste-ci"
title = "Paste CI failures into this agent"
contexts = ["pane"]
command = ["mise", "exec", "--", "bun", "dist/index.js", "paste", "--kind", "ci"]

[[actions]]
id = "paste-lint"
title = "Paste lint failures into this agent"
contexts = ["pane"]
command = ["mise", "exec", "--", "bun", "dist/index.js", "paste", "--kind", "lint"]
