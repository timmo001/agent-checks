---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@d72cb59ea00e4fbf9cfc2dc1fb8f67ebd468e8e4 # master
    with:
      name: Build
      task: build
