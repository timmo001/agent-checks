---
# Deploys the prod stage of the docs site's Alchemy stack in docs/alchemy.run.ts
# from main: the agent-checks-docs Worker at agent-checks.timmo.dev. The
# Cloudflare token comes from docs/stacks/github.ts.
name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-docs.yml
      - docs/**
      - mise.toml
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: timmo001/workflows/.github/workflows/deploy-alchemy.yml@1a88a7bd6ac2b8dc40e71c5fa197675c08af7ee0 # master
    with:
      task: docs:deploy
      smoke-check: |
        https://agent-checks.timmo.dev/ 200
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
