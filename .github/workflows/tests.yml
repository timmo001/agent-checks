---
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@e34d060ab6066dcc7687737b6ef7a344d6598d58 # master
    with:
      name: CLI smoke check
      task: build
      smoke-test: bun dist/index.js --help
