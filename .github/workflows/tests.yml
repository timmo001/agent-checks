---
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@14d19f1ed549f13581d47e9c297b8240f39e3db4 # master
    with:
      name: CLI smoke check
      task: build
      smoke-test: bun dist/index.js --help
