---
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      name: CLI smoke check
      task: build
      smoke-test: bun dist/index.js --help
