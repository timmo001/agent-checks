---
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@905448fa92f24569f969bd19ec0cbb78d6557d49 # master
    with:
      name: CLI smoke check
      task: build
      smoke-test: bun dist/index.js --help
