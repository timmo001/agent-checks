---
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@1a88a7bd6ac2b8dc40e71c5fa197675c08af7ee0 # master
    with:
      name: CLI smoke check
      task: build
      smoke-test: bun dist/index.js --help
