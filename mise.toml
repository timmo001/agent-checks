min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.2"
uv = "0.12.23"
"npm:markdownlint-cli2" = "0.23.3"
"pipx:yamllint" = "1.38.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check and verify formatting"
depends = ["lint", "typecheck", "format:check"]

[tasks.build]
description = "Build the Bun module into dist"
depends = ["install"]
run = "bun run build"

[tasks.validate]
description = "Validate the Omarchy plugin manifest"
# node_modules holds symlinks the validator refuses, so check the files git
# would ship, as an installed checkout has them.
run = '''
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
git ls-files -z --cached --others --exclude-standard | while IFS= read -r -d '' file; do
  if [ -e "$file" ]; then cp --parents -t "$dir" "$file"; fi
done
omarchy plugin validate "$dir"
'''

[tasks."lint:qml"]
description = "Lint the plugin QML"
run = "/usr/lib/qt6/bin/qmllint --max-warnings 0 *.qml"

[tasks."check:plugin"]
description = "Validate the plugin manifest and lint the QML"
depends = ["validate", "lint:qml"]
