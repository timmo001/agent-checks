min_version = "2025.1.0"

[tools]
node = "26.12.1"
bun = "1.4.4"
uv = "0.13.5"
"npm:markdownlint-cli2" = "0.24.0"
"pipx:yamllint" = "1.38.0"
# Approved for aube's package-age check while the package is under 30 days old.
"npm:@timmo001/tooling-drift" = { version = "0.1.4", allow_low_downloads = true }

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check and verify formatting"
depends = ["lint", "typecheck", "format:check"]

[tasks.build]
description = "Build the Bun module into dist"
depends = ["install"]
run = "bun run build"

[tasks.validate]
description = "Validate the Omarchy plugin manifest"
# node_modules holds symlinks the validator refuses, so check the files git
# would ship, as an installed checkout has them.
run = '''
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
git ls-files -z --cached --others --exclude-standard | while IFS= read -r -d '' file; do
  if [ -e "$file" ]; then cp --parents -t "$dir" "$file"; fi
done
omarchy plugin validate "$dir"
'''

[tasks."lint:qml"]
description = "Lint the plugin QML"
run = "/usr/lib/qt6/bin/qmllint --max-warnings 0 *.qml"

[tasks."check:plugin"]
description = "Validate the plugin manifest and lint the QML"
depends = ["validate", "lint:qml"]

[tasks."tooling:status"]
description = "Compare the reviewed Herdr release in tooling.yml with the latest"
run = "tooling-drift status"

[tasks."tooling:update"]
description = "Record a tool release as reviewed in tooling.yml after reviewing it"
usage = '''
arg "<repo>" help="Tool repository, e.g. herdrdev/herdr"
arg "<tag>" help="Release tag, e.g. v0.9.5"
'''
run = "tooling-drift update $usage_repo $usage_tag"

[tasks."tooling:publish"]
description = "Open or refresh a draft review pull request when a newer Herdr release is out"
run = "tooling-drift publish"
