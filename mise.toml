min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.4"
uv = "0.13.8"
"npm:markdownlint-cli2" = "0.24.1"
"pipx:yamllint" = "1.38.0"
python = "3.14.10"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type-check source"
depends = ["install"]
run = "bun run typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install --frozen-lockfile"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["docs:install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:check"]
description = "Check the docs site, apart from a running dev server"
depends = ["docs:install"]
dir = "docs"
run = "bun run check"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."docs:plan"]
description = "Build the docs site, then show what deploying its prod stage would change"
depends = ["docs:build"]
dir = "docs"
run = "bun run plan"

[tasks."docs:deploy"]
description = "Build the docs site, then deploy its prod stage with Alchemy"
depends = ["docs:build"]
dir = "docs"
run = "bun run deploy"

[tasks."docs:deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["docs:install"]
dir = "docs"
run = "bun run deploy:github"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks.check]
description = "Lint, type-check, verify formatting and check the docs site"
depends = ["lint", "typecheck", "format:check", "docs:check"]

[tasks.build]
description = "Build the Bun module into dist"
depends = ["install"]
run = "bun run build"

[tasks.validate]
description = "Validate the Omarchy plugin manifest"
# node_modules holds symlinks the validator refuses, so check the files git
# would ship, as an installed checkout has them.
run = '''
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
git ls-files -z --cached --others --exclude-standard | while IFS= read -r -d '' file; do
  if [ -e "$file" ]; then cp --parents -t "$dir" "$file"; fi
done
omarchy plugin validate "$dir"
'''

[tasks."lint:qml"]
description = "Lint the plugin QML"
# The Omarchy shell's qs.* modules come from its own directory, which Quickshell
# serves as qs; without them qmllint takes BarWidget and Panel for this plugin's.
run = '''
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
ln -s "${OMARCHY_PATH:-$HOME/.local/share/omarchy}/shell" "$dir/qs"
/usr/lib/qt6/bin/qmllint -I "$dir" --max-warnings 0 *.qml
'''

[tasks."check:plugin"]
description = "Validate the plugin manifest and lint the QML"
depends = ["validate", "lint:qml"]
